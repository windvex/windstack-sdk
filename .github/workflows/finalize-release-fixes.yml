name: Apply final release fixes

on:
  push:
    branches:
      - main
    paths:
      - "scripts/finalize-release-fixes.mjs"
      - ".github/workflows/finalize-release-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Apply compatibility fixes
        run: node scripts/finalize-release-fixes.mjs
      - name: Format repository
        run: npm run format
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages scripts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: finalize release compatibility"
          git push origin HEAD:main
