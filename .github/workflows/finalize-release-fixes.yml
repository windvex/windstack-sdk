name: Apply final release fixes

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-release-fixes.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Apply follow-up fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('packages/signing-request/src/request.ts')
          source = path.read_text()
          before = '    scope: validateName(identity.scope, "Identity scope"),'
          after = '    scope: validateName(identity.scope ?? "", "Identity scope"),'
          if before not in source:
              raise SystemExit('follow-up target not found')
          path.write_text(source.replace(before, after, 1))
          PY
      - name: Format repository
        run: npm run format
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages scripts package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: require scope for revision 3 identity creation"
          git push origin HEAD:main
