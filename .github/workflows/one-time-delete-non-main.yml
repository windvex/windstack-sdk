name: One-time delete non-main branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    name: delete-non-main-branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Delete audited non-main branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "__do_not_use"
            "audit/release-1.0.0-hardening"
            "feat/native-antelope-sdk-v1"
            "tmp/windswap-lockgen"
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
